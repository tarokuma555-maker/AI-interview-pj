<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 試作版の仮の面接官(イラスト)。目・口・あごの位置は features/avatar/manifest.ts の PLACEHOLDER_AVATAR と揃える。表情違いの画像は scripts/generate-placeholder-avatar.mjs で作る -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f6"/>
      <stop offset="1" stop-color="#d3dbe4"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skin" cx="0.46" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#f6d6bb"/>
      <stop offset="0.7" stop-color="#efc6a4"/>
      <stop offset="1" stop-color="#dfab86"/>
    </radialGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d49c78"/>
      <stop offset="0.45" stop-color="#e8b994"/>
      <stop offset="1" stop-color="#ebbf9b"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3a55"/>
      <stop offset="1" stop-color="#1e2840"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a302b"/>
      <stop offset="1" stop-color="#241d1a"/>
    </linearGradient>
    <linearGradient id="tie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f5f8f"/>
      <stop offset="1" stop-color="#2c4670"/>
    </linearGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e98f86" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e98f86" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="eyeL"><path d="M407 441 Q440 420 473 439 Q440 457 407 441 Z"/></clipPath>
    <clipPath id="eyeR"><path d="M551 439 Q584 420 617 441 Q584 457 551 439 Z"/></clipPath>
